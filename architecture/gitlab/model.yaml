apiVersion: noodle/v1alpha1
kind: Model
elements:
  # Zones
  - {id: z-internet, kind: region, color: slate, icon: globe, title: INTERNET}
  - {id: z-target-cluster, kind: region, color: amber, icon: kubernetes, title: TARGET CLUSTER}
  - {id: z-cluster, kind: region, color: cyan, icon: kubernetes, title: ARFFORNIA CLUSTER}
  - {id: g-gateway, kind: group, parent: z-cluster, color: emerald, icon: envoy-gateway, title: GATEWAY API, sub: gateway-infra}
  - {id: g-secrets, kind: group, parent: z-cluster, color: rose, icon: vault, title: SECRETS, sub: vault · vault-secrets-operator}
  - {id: g-gitlab, kind: group, parent: z-cluster, color: orange, icon: gitlab, title: GITLAB, sub: namespace gitlab · chart 10.5.4}
  - {id: z-workstation, kind: region, color: slate, icon: rack, title: WORKSTATION}
  - {id: g-ci, kind: group, parent: z-cluster, color: orange, icon: gitlab, title: CI JOBS, sub: namespace gitlab}
  - {id: g-agent-demo, kind: group, parent: z-cluster, color: amber, icon: gitlab, title: AGENT · TEAM DEMO, sub: namespace gitlab-agent-demo}
  - {id: g-control-plane, kind: group, parent: z-cluster, color: sky, icon: kubernetes, title: CONTROL PLANE}
  - {id: g-app-demo, kind: group, parent: z-cluster, color: emerald, icon: k8s-ns, title: APPS · TEAM DEMO, sub: namespace demo-sandbox}
  - {id: g-data, kind: group, parent: z-cluster, color: violet, icon: k8s-ns, title: STATE, sub: gitlab · postgres · garage-s3}

  # Clients
  - {id: developer, kind: frontend, parent: z-internet, shape: actor, icon: user, title: Developer, desc: "browser · git · docker"}
  - {id: agentk, kind: external, parent: z-target-cluster, icon: gitlab, title: agentk, tech: "[GitLab agent · Go]",
     desc: "Runs in the managed cluster"}

  # Gateway
  - {id: envoy, kind: backend, parent: g-gateway, icon: envoy, title: shared-gateway, tech: "[Envoy Gateway · HTTPRoutes]",
     desc: "TLS for *.arffornia.com<br>routes from secure-route",
     ports: [{name: https, protocol: TCP, port: 443}]}

  # Secrets
  - {id: vso, kind: security, parent: g-secrets, icon: k8s-crd, title: Vault Secrets Operator, tech: "[18 VaultSecrets]",
     desc: "Writes the Secrets pods read"}
  - {id: vault, kind: database, parent: g-secrets, icon: vault, title: Vault, tech: "[KV v2 · kvv2/gitlab/*]",
     desc: "Values from Terraform",
     ports: [{name: api, protocol: TCP, port: 8200}]}

  # GitLab
  - {id: workhorse, kind: backend, parent: g-gitlab, icon: gitlab, title: Workhorse, tech: "[Go · webservice pod]",
     desc: "Smart proxy: Git HTTP, uploads,<br>downloads and websockets",
     ports: [{name: http, protocol: TCP, port: 8181}]}
  - {id: puma, kind: backend, parent: g-gitlab, icon: gitlab, title: Puma · Rails, tech: "[Ruby · webservice pod]",
     desc: "UI, API, permissions, business logic",
     ports: [{name: http, protocol: TCP, port: 8080}]}
  - {id: registry, kind: backend, parent: g-gitlab, icon: docker, title: Registry, tech: "[Go · Distribution fork]",
     desc: "Images, auth via tokens from Rails",
     ports: [{name: http, protocol: TCP, port: 5000}]}
  - {id: sidekiq, kind: backend, parent: g-gitlab, icon: gitlab, title: Sidekiq, tech: "[Ruby · same code as Rails]",
     desc: "Jobs: pipelines, mails, webhooks"}
  - {id: kas, kind: backend, parent: g-gitlab, icon: gitlab, title: KAS, tech: "[Go · agent server]",
     desc: "Agent tunnels, kubectl proxy",
     ports: [{name: agent, protocol: TCP, port: 8150}, {name: k8s-proxy, protocol: TCP, port: 8154}]}
  - {id: runner, kind: backend, parent: g-gitlab, icon: gitlab, title: GitLab Runner, tech: "[Go · Kubernetes executor]",
     desc: "One pod per CI job"}

  # Agents for Kubernetes
  - {id: terraform, kind: tool, parent: z-workstation, icon: terraform, title: Terraform, tech: "[terraform/gitlab.tf]",
     desc: "Agent and its token"}
  - {id: ci-job, kind: backend, parent: g-ci, icon: k8s-pod, title: CI job, tech: "[project in apps/demo]",
     desc: "kubectl with GitLab context", multiplicity: "one pod per CI job"}
  - {id: agentk-demo, kind: backend, parent: g-agent-demo, icon: gitlab, title: agentk, tech: "[gitlab-agent 2.33.0]",
     desc: "Tunnel to KAS, uses own SA"}
  - {id: kube-apiserver, kind: backend, parent: g-control-plane, icon: kubernetes, title: kube-apiserver, tech: "[Kubernetes 1.30]",
     desc: "Checks RBAC of the agent SA",
     ports: [{name: https, protocol: TCP, port: 6443}]}
  - {id: rb-demo, kind: security, parent: g-app-demo, icon: k8s-crd, title: RoleBinding edit, tech: "[agent SA, this ns only]",
     desc: "The agent's only write right"}
  - {id: demo-workloads, kind: backend, parent: g-app-demo, icon: k8s-deploy, title: Team workloads, tech: "[ResourceQuota, LimitRange]",
     desc: "Deployed by pipelines", multiplicity: "one namespace per app"}

  # State
  - {id: gitaly, kind: database, parent: g-data, shape: cylinder, icon: git, title: Gitaly, tech: "[Go gRPC · PVC 20Gi]",
     desc: "The only component touching Git repos",
     ports: [{name: grpc, protocol: TCP, port: 8075}]}
  - {id: redis, kind: database, parent: g-data, shape: cylinder, icon: redis, title: Redis, tech: "[redis 7.4 · gitlab-redis]",
     desc: "Cache, sessions, Sidekiq queues",
     ports: [{name: resp, protocol: TCP, port: 6379}]}
  - {id: postgres, kind: database, parent: g-data, shape: cylinder, icon: postgresql, title: PostgreSQL, tech: "[Zalando · postgres-cluster]",
     desc: "Database gitlab: all metadata",
     ports: [{name: pg, protocol: TCP, port: 5432}]}
  - {id: garage, kind: database, parent: g-data, shape: cylinder, icon: garage, title: Garage S3, tech: "[10 gitlab-* buckets]",
     desc: "Artifacts, LFS, uploads, packages, images",
     ports: [{name: s3, protocol: TCP, port: 3900}]}

connections:
  - {id: c-ci-job-envoy, from: ci-job, to: envoy, kind: flow, port: https, protocol: HTTPS, verb: kubectl via /k8s-proxy}
  - {id: c-envoy-kas-proxy, from: envoy, to: kas, kind: flow, port: k8s-proxy, protocol: HTTP, verb: proxy}
  - {id: c-agentk-kas, from: agentk-demo, to: kas, kind: tunnel, port: agent, protocol: WS, verb: open tunnel}
  - {id: c-agentk-apiserver, from: agentk-demo, to: kube-apiserver, kind: flow, port: https, protocol: HTTPS, verb: apply as agent SA}
  - {id: c-terraform-vault, from: terraform, to: vault, kind: flow, port: api, protocol: HTTPS, verb: store agent token}
  - {id: c-developer-envoy, from: developer, to: envoy, kind: flow, port: https, protocol: HTTPS, verb: git push}
  - {id: c-envoy-workhorse, from: envoy, to: workhorse, kind: flow, port: http, protocol: HTTP, verb: proxy}
  - {id: c-workhorse-puma, from: workhorse, to: puma, kind: flow, port: http, protocol: HTTP, verb: authorize}
  - {id: c-workhorse-gitaly, from: workhorse, to: gitaly, kind: flow, port: grpc, protocol: gRPC, verb: receive-pack}
  - {id: c-gitaly-puma, from: gitaly, to: puma, kind: flow, port: http, protocol: HTTP, verb: pre-receive hook}
  - {id: c-puma-redis, from: puma, to: redis, kind: flow, port: resp, protocol: RESP, verb: enqueue PostReceive}
  - {id: c-sidekiq-redis, from: sidekiq, to: redis, kind: flow, port: resp, protocol: RESP, verb: dequeue}
  - {id: c-sidekiq-postgres, from: sidekiq, to: postgres, kind: flow, port: pg, protocol: SQL, verb: create pipeline}
  - {id: c-puma-postgres, from: puma, to: postgres, kind: flow, port: pg, protocol: SQL, verb: query}
  - {id: c-workhorse-garage, from: workhorse, to: garage, kind: flow, port: s3, protocol: S3, verb: direct upload}
  - {id: c-envoy-registry, from: envoy, to: registry, kind: flow, port: http, protocol: HTTP, verb: docker push}
  - {id: c-registry-garage, from: registry, to: garage, kind: flow, port: s3, protocol: S3, verb: store layers}
  - {id: c-agentk-envoy, from: agentk, to: envoy, kind: tunnel, port: https, protocol: WSS, verb: open tunnel}
  - {id: c-envoy-kas, from: envoy, to: kas, kind: tunnel, port: agent, protocol: WS, verb: proxy tunnel}
  - {id: c-kas-puma, from: kas, to: puma, kind: auth, port: http, protocol: HTTP, verb: check agent token}
  - {id: c-runner-envoy, from: runner, to: envoy, kind: async, port: https, protocol: HTTPS, verb: poll jobs}
  - {id: c-vso-vault, from: vso, to: vault, kind: async, port: api, protocol: HTTPS, verb: read secrets}
references:
  - {id: r-rb-demo-agentk, from: rb-demo, to: agentk-demo, kind: subject}
