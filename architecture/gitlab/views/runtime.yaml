apiVersion: noodle/v1alpha1
kind: View
type: topology
title: Arffornia · GitLab · Runtime
subtitle: Which GitLab component handles what, and where its state lives.
meta:
  - "Scope: GitLab chart 10.5.4 (GitLab 19.5.3) in namespace gitlab and the services it uses"
  - "Not drawn: Puma, Sidekiq and KAS also call Gitaly and Garage; Registry notifies Rails; Toolbox and the migrations Job"
  - "Out of scope: optional modules (Pages, Zoekt, Geo...), the target cluster's own resources"
  - "v0.1 · source: k8s/config/gitlab, terraform/secret_templates.tf"
steps:
  - c-developer-envoy
  - c-envoy-workhorse
  - c-workhorse-puma
  - c-workhorse-gitaly
  - c-gitaly-puma
  - c-puma-redis
  - c-sidekiq-redis
  - c-sidekiq-postgres
background:
  - c-vso-vault
  - c-agentk-envoy
  - c-envoy-kas
  - c-kas-puma
  - c-runner-envoy
cards:
  - id: card-legend
    title: Legend
    color: slate
    legend: true
  - id: card-steps
    title: "Request path · data plane: a git push over HTTPS"
    color: emerald
    lines:
      - "[1] git sends the pack to gitlab.arffornia.com, Envoy terminates TLS"
      - "[2] Envoy proxies to Workhorse, no timeout for long pushes"
      - "[3] Workhorse asks Rails whether the user may push"
      - "[4] Workhorse streams the pack straight to Gitaly, Ruby never sees it"
      - "[5] Gitaly's pre-receive hook asks Rails about protected branches"
      - "[6] Rails enqueues a PostReceive job in Redis"
      - "[7] Sidekiq picks the job up"
      - "[8] Sidekiq creates the pipeline, updates MRs, fires webhooks"
  - id: card-background
    title: Background · control plane
    color: indigo
    lines:
      - "[A] VSO copies the 18 GitLab secrets from Vault into Kubernetes Secrets"
      - "[B] agentk opens an outbound websocket: the target cluster exposes nothing"
      - "[C] Envoy relays the tunnel to KAS on gitlab-kas.arffornia.com"
      - "[D] KAS validates the agent token with Rails, then serves kubectl and GitOps"
      - "[E] The runner polls the public API for jobs, then starts one pod per job"
labels:
  c-agentk-envoy: ""
  c-envoy-kas: ""
  c-kas-puma: ""
  c-runner-envoy: ""
  c-puma-redis: ""
  c-sidekiq-postgres: ""
