apiVersion: noodle/v1alpha1
kind: View
type: topology
title: Arffornia · GitLab · Agent for Kubernetes
subtitle: How a team's CI job deploys to its namespace, and why it cannot reach anything else.
meta:
  - "Scope: one team (demo) and its agent; every team file in k8s/config/gitlab-agents/teams gets the same pieces"
  - "Not drawn: Terraform also writes the agent and .gitlab/agents/demo/config.yaml through the GitLab API; Argo CD deploys the agent"
  - "Out of scope: how the CI job pod is started by the runner, GitLab internals (see view runtime)"
  - "v0.1 · source: terraform/gitlab.tf, k8s/config/gitlab-agents"
include:
  - z-workstation/**
  - z-cluster
  - g-ci/**
  - g-gateway/**
  - g-agent-demo/**
  - g-control-plane/**
  - g-app-demo/**
  - g-secrets/**
  - g-gitlab
  - kas
steps:
  - c-ci-job-envoy
  - c-envoy-kas-proxy
  - c-agentk-kas
  - c-agentk-apiserver
background:
  - c-terraform-vault
  - c-vso-vault
labels:
  c-agentk-kas: "relayed via tunnel ◀"
  c-envoy-kas: "agents outside the cluster · WS"
cards:
  - id: card-legend
    title: Legend
    color: slate
    legend: true
  - id: card-steps
    title: "Request path · data plane: kubectl apply from a pipeline"
    color: emerald
    lines:
      - "[1] The job runs kubectl with the KUBECONFIG GitLab injects (context apps/platform/agent-demo:demo)"
      - "[2] Envoy proxies /k8s-proxy to KAS"
      - "[3] KAS relays the call through the tunnel agentk opened beforehand"
      - "[4] agentk sends it to the API server as its own service account"
  - id: card-background
    title: Background · control plane
    color: indigo
    lines:
      - "[A] Terraform creates the agent and its token, and stores the token in Vault"
      - "[B] VSO copies it into the Secret agentk reads at start"
  - id: card-isolation
    title: Isolation (free tier, one agent per team)
    color: rose
    lines:
      - "Only projects of group apps/demo, on protected branches, may use this agent"
      - "The agent SA has edit in demo-sandbox only: no ClusterRole, no other namespace"
      - "can-i create deployments -n demo-sandbox → yes · get secrets -n gitlab → no"
