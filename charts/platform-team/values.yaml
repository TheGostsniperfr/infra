# Set by the ApplicationSet k8s/apps/gitlab-agents.yaml from k8s/config/gitlab-agents/teams/<team>.yaml
team: ""
# <app>: {database: bool, roles: ...}
apps: {}
# Every app has these components, each its own GitLab project forked from a template
# (terraform/apps.tf) and its own Argo CD Application rendering charts/app
components: [backend, frontend]

# Argo CD reads the platform chart here and the app's deploy repository on GitLab
infraRepo: https://github.com/TheGostsniperfr/infra.git
gitlabUrl: https://gitlab.arffornia.com
oidcIssuer: https://auth.arffornia.com/realms/arffornia

# Hostname of the GitLab registry, for the image pull secret of every app namespace
registryHost: gitlab-registry.arffornia.com
# Apps are published as <app>-<team>.<baseDomain>, the only hostname their HTTPRoutes may use
baseDomain: arffornia.com

# Per-app database (Zalando postgres-operator), one instance: a demo, no backup
database:
  version: "17"
  # The image the postgres-operator runs, exempted from Pod Security `restricted` (it runs as root)
  image: ghcr.io/zalando/spilo-17:4.0-p3
  size: 2Gi
  storageClass: longhorn

# Per app namespace: a team cannot starve the cluster, and gets neither a LoadBalancer IP (the
# MetalLB pool only has 10 addresses) nor a NodePort (it would bypass the gateway)
quota:
  requests.cpu: "2"
  requests.memory: 4Gi
  limits.memory: 8Gi
  pods: "20"
  services.loadbalancers: "0"
  services.nodeports: "0"
# Defaults for containers that set no resources
limitRange:
  defaultRequest:
    cpu: 50m
    memory: 128Mi
  default:
    memory: 512Mi
