{{- range $app, $cfg := .Values.apps }}
{{- $ns := printf "%s-%s" $.Values.team $app }}
{{- $deployRepo := printf "%s/apps/%s/%s/deploy.git" $.Values.gitlabUrl $.Values.team $app }}
# Where the app's Application may deploy: the app's namespace only, no cluster-scoped object, from
# the platform's charts and the app's deploy repository. What a manifest may contain is decided
# before (charts/app and its schema: a team writes values, never manifests) and after (Kyverno, on
# every object of the namespace, whoever creates it).
# https://argo-cd.readthedocs.io/en/stable/user-guide/projects/
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: app-{{ $ns }}
  namespace: argocd
spec:
  description: App {{ $app }} of team {{ $.Values.team }} (charts/platform-team)
  sourceRepos:
    - {{ $.Values.infraRepo }}
    - {{ $deployRepo }}
  destinations:
    - name: in-cluster
      namespace: {{ $ns }}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    # What the platform's charts render (charts/app, charts/app-database)
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: ricoberger.de
      kind: VaultSecret
    - group: acid.zalan.do
      kind: postgresql
    # What controllers create from them. No chart renders these; they are listed because Argo CD
    # hides from an Application's tree, logs included, every kind its project does not permit
    - group: apps
      kind: ReplicaSet
    - group: apps
      kind: StatefulSet
    - group: ""
      kind: Pod
    - group: ""
      kind: Endpoints
    - group: ""
      kind: Secret
    - group: policy
      kind: PodDisruptionBudget
---
{{- range $component := $.Values.components }}
{{- $withDatabase := and $cfg.database (eq $component $.Values.databaseComponent) }}
# One Application per component, so each syncs and fails on its own, at the pace of its own
# pipeline: charts/app with apps/{{ $.Values.team }}/{{ $app }}/deploy:{{ $component }}.yaml (nothing until that file
# exists){{ if $withDatabase }}, and the app's database, which this component uses{{ end }}.
# The app's Applications share the project app-{{ $ns }}: filter on it to see the whole app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $ns }}-{{ $component }}
  namespace: argocd
  # Compare with what the API server would store: it defaults fields of HTTPRoutes (group, kind,
  # weight) that the chart does not set. Kyverno's annotations are part of that dry run too.
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
  # No resources finalizer: everything this Application deploys lives in the app's namespace, and
  # removing the app deletes the namespace. With one, removing the app deleted the AppProject at
  # the same time, and the finalizer then waited forever for its missing project.
spec:
  project: app-{{ $ns }}
  sources:
    - repoURL: {{ $.Values.infraRepo }}
      targetRevision: HEAD
      path: charts/app
      helm:
        releaseName: {{ $component }}
        valueFiles:
          - $deploy/{{ $component }}.yaml
        ignoreMissingValueFiles: true
        # Precedence over the values file: the team cannot set these
        valuesObject:
          platform:
            team: {{ $.Values.team }}
            app: {{ $app }}
            component: {{ $component }}
            host: {{ $app }}-{{ $.Values.team }}.{{ $.Values.baseDomain }}
            registry: {{ $.Values.registryHost }}
            oidcIssuer: {{ $.Values.oidcIssuer }}
            oidcClientId: {{ $ns }}
            database: {{ $cfg.database | default false }}
    {{- if $withDatabase }}
    - repoURL: {{ $.Values.infraRepo }}
      targetRevision: HEAD
      path: charts/app-database
      helm:
        releaseName: database
        valuesObject:
          app: {{ $app }}
          team: {{ $.Values.team }}
          version: {{ $.Values.database.version | quote }}
          size: {{ $.Values.database.size }}
          storageClass: {{ $.Values.database.storageClass }}
    {{- end }}
    - repoURL: {{ $deployRepo }}
      targetRevision: main
      ref: deploy
  destination:
    name: in-cluster
    namespace: {{ $ns }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
{{- end }}
{{- end }}
# Argo CD reads the deploy repositories of the team with a group deploy token (read_repository on
# apps/<team>), created by Terraform. Credential template for every repository under that URL.
# https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/#repository-credentials
# Vault path: kvv2/gitlab-agents/<team>-repo  keys: username, password
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: repo-creds-apps-{{ .Values.team }}
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
spec:
  path: kvv2/gitlab-agents/{{ .Values.team }}-repo
  vaultRole: gitlab-agents-role
  keys:
    - username
    - password
  templates:
    type: git
    url: {{ .Values.gitlabUrl }}/apps/{{ .Values.team }}/
    username: '{% .Secrets.username %}'
    password: '{% .Secrets.password %}'
  type: Opaque
