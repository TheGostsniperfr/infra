# Set by the ApplicationSet k8s/apps/gitlab-agents.yaml from k8s/config/gitlab-agents/teams/<team>.yaml
team: ""
namespaces: []

# Per application namespace: a team cannot starve the cluster, and gets no LoadBalancer IP
# (the MetalLB pool only has 10 addresses)
quota:
  requests.cpu: "2"
  requests.memory: 4Gi
  limits.memory: 8Gi
  pods: "20"
  services.loadbalancers: "0"
# Defaults for containers that set no resources
limitRange:
  defaultRequest:
    cpu: 50m
    memory: 128Mi
  default:
    memory: 512Mi
