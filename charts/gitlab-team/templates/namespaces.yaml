{{- range $ns := .Values.namespaces }}
# Application namespace of team {{ $.Values.team }}. The team's agent gets `edit` here and nowhere
# else: a CI job of this team cannot read or change another team's namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    team: {{ $.Values.team }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gitlab-team.agent" $ }}-edit
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: {{ include "gitlab-team.agent" $ }}
    namespace: {{ include "gitlab-team.agent" $ }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: {{ $ns }}
spec:
  hard:
    {{- toYaml $.Values.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: {{ $ns }}
spec:
  limits:
    - type: Container
      {{- toYaml $.Values.limitRange | nindent 6 }}
---
{{- end }}
