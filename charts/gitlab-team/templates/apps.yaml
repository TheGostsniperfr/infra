{{- range $app, $cfg := .Values.apps }}
{{- $ns := printf "%s-%s" $.Values.team $app }}
# App {{ $app }} of team {{ $.Values.team }}. Argo CD deploys its components here (argocd.yaml); no
# team member and no pipeline has rights in it. Pod Security `baseline` is enforced by Kubernetes
# itself; `restricted` by the Kyverno Policy in guardrails.yaml, which only exempts the Spilo image.
# platform.arffornia.com/team: only cluster admins label namespaces, so the network policies of
# network.yaml can trust it to recognise the team's other apps.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    team: {{ $.Values.team }}
    app: {{ $app }}
    platform.arffornia.com/team: {{ $.Values.team }}
    prod-gateway-access: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: app-quota
  namespace: {{ $ns }}
spec:
  hard:
    {{- toYaml $.Values.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: {{ $ns }}
spec:
  limits:
    - type: Container
      {{- toYaml $.Values.limitRange | nindent 6 }}
---
# Pull secret for the team's images: group deploy token (read_registry), created by Terraform
# Vault path: kvv2/gitlab-agents/<team>-registry  keys: username, password
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: registry-pull
  namespace: {{ $ns }}
spec:
  path: kvv2/gitlab-agents/{{ $.Values.team }}-registry
  vaultRole: apps-{{ $ns }}
  keys:
    - username
    - password
  templates:
    .dockerconfigjson: '{"auths":{"{{ $.Values.registryHost }}":{"username":"{% .Secrets.username %}","password":"{% .Secrets.password %}"}}}'
  type: kubernetes.io/dockerconfigjson
---
{{- if $cfg.database }}
# Database of the app. The operator writes the credentials to the Secret
# app.{{ $app }}-db.credentials.postgresql.acid.zalan.do in this namespace (keys username, password).
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: {{ $app }}-db
  namespace: {{ $ns }}
spec:
  teamId: {{ $.Values.team }}
  numberOfInstances: 1
  postgresql:
    version: {{ $.Values.database.version | quote }}
  volume:
    size: {{ $.Values.database.size }}
    storageClass: {{ $.Values.database.storageClass }}
  users:
    app: []
  databases:
    app: app
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
---
{{- end }}
{{- end }}
