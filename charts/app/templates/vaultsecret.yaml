{{- if and .Values.image.digest .Values.secrets }}
# Vault path: kvv2/apps/<team>/<app>  keys: the names listed in `secrets`
# The role only reads this app's path (terraform/apps.tf), and Kyverno refuses any other role here
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: {{ include "app.name" . }}-secrets
spec:
  path: kvv2/apps/{{ .Values.platform.team }}/{{ .Values.platform.app }}
  vaultRole: {{ include "app.vaultRole" . }}
  keys:
    {{- toYaml .Values.secrets | nindent 4 }}
  type: Opaque
{{- end }}
