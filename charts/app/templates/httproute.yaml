{{- if and .Values.image.digest .Values.route }}
# On the shared gateway, under the app's own host only (Kyverno checks it again in the namespace)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "app.name" . }}
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway-infra
  hostnames:
    - {{ required "platform.host is required" .Values.platform.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.path | default "/" | quote }}
      backendRefs:
        - name: {{ include "app.name" . }}
          port: {{ .Values.port }}
{{- end }}
