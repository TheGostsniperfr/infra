{{- if .Values.image.digest }}
{{- $p := .Values.platform }}
{{- if and .Values.database (not $p.database) }}
{{- fail "database: true, but the app has no database (database in teams/<team>.yaml)" }}
{{- end }}
{{- $probes := dict "startup" "startupProbe" "readiness" "readinessProbe" "liveness" "livenessProbe" }}
# Everything that makes a Pod safe is fixed here, not in values: non-root, read-only root
# filesystem, no capabilities, no service account token (apps never call the Kubernetes API).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "app.name" . }}
    app.kubernetes.io/part-of: {{ $p.app }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "app.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "app.name" . }}
        app.kubernetes.io/part-of: {{ $p.app }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "app.name" . }}
          image: "{{ $p.registry }}/apps/{{ $p.team }}/{{ $p.app }}/{{ $p.component }}@{{ .Values.image.digest }}"
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.secrets }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.name" $ }}-secrets
                  key: {{ . }}
            {{- end }}
            {{- if .Values.database }}
            - name: DB_HOST
              value: {{ $p.app }}-db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app.{{ $p.app }}-db.credentials.postgresql.acid.zalan.do
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app.{{ $p.app }}-db.credentials.postgresql.acid.zalan.do
                  key: password
            {{- end }}
            {{- if .Values.oidc }}
            - name: OIDC_ISSUER
              value: {{ $p.oidcIssuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ $p.oidcClientId | quote }}
            {{- end }}
          {{- range $kind, $field := $probes }}
          {{- with get $.Values.health $kind }}
          {{ $field }}:
            httpGet: {path: {{ . | quote }}, port: http}
            {{- if eq $kind "startup" }}
            periodSeconds: 5
            failureThreshold: 30
            {{- end }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
