# Vault path: kvv2/logging/loki-s3  keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# Garage key loki-key on the bucket loki (README.md)
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: loki-s3
  namespace: logging
spec:
  path: kvv2/logging/loki-s3
  vaultRole: logging-role
  keys:
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
  type: Opaque
