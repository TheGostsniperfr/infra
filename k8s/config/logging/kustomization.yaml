apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: logging

resources:
  - namespace.yaml
  - secret.yaml
  - rules.yaml

helmCharts:
  - name: loki
    repo: https://grafana.github.io/helm-charts
    version: 7.5.0
    releaseName: loki
    namespace: logging
    valuesFile: loki-values.yaml
    # The chart only renders its ServiceMonitor when this API is announced
    apiVersions:
      - monitoring.coreos.com/v1/ServiceMonitor

  - name: alloy
    repo: https://grafana.github.io/helm-charts
    version: 1.14.3
    releaseName: alloy
    namespace: logging
    valuesFile: alloy-values.yaml
