# Grafana Alloy, one pod per node: tails the container logs of the pods on its node from
# /var/log/pods and pushes them to Loki with namespace, pod, container, node and app labels.
# Chart: https://grafana.com/docs/alloy/latest/configure/kubernetes/
# Values reference: https://github.com/grafana/alloy/blob/helm-chart/1.14.0/operations/helm/charts/alloy/values.yaml
# Components: https://grafana.com/docs/alloy/latest/reference/components/

alloy:
  mounts:
    # /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log, read-only
    varlog: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  configMap:
    content: |
      // Only the pods scheduled on this node: every node has its own Alloy
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
          separator     = ";"
          regex         = "^;*([^;]+);*.*$"
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        // containerd writes "<time> <stream> <flag> <line>"
        stage.cri {}
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

# Also on the control-plane node: etcd, kube-apiserver and the scheduler log there
controller:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

serviceMonitor:
  enabled: true
