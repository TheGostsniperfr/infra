apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: first-pool
  namespace: metallb-system
spec:
  # The box leases 192.168.1.1-199 by DHCP and the range cannot be changed, so the pool stays above
  # it. .210-.230 are OpenStack VMs, .244 is left out on purpose, .254 is the box. Every
  # LoadBalancer pins its IP (metallb.universe.tf/loadBalancerIPs): the pool has 10 addresses.
  addresses:
  - 192.168.1.240-192.168.1.243
  - 192.168.1.245-192.168.1.250
