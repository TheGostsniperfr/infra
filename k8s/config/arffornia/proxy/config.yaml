apiVersion: v1
kind: ConfigMap
metadata:
  name: arffornia-proxy-config
  namespace: arffornia-proxy-velocity
data:
  # Allow to dynamically sync values from /plugins, /mods, and /config with env var
  # See doc: https://docker-minecraft-server.readthedocs.io/en/latest/configuration/interpolating/#replacing-variables-inside-configs
  REPLACE_ENV_VARIABLES: "true"
  REPLACE_ENV_DURING_SYNC: "true"
  REPLACE_ENV_VARIABLE_PREFIX: "CFG_"
  REPLACE_ENV_SUFFIXES: "yml,yaml,txt,cfg,conf,properties,hjson,json,tml,toml,key" # adding .key for nuvotifier keys

  # Website API, reached inside the cluster (no hairpin through the router or Cloudflare).
  # Used by the provisioned configs as ${CFG_API_BASE_URL}.
  CFG_API_BASE_URL: "http://arffornia-website-chart.arffornia-website.svc.cluster.local/api"
