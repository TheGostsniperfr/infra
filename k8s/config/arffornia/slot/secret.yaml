# Staging values only (Terraform: terraform/playtest.tf). Kyverno refuses any other role or path
# in this namespace.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: slot-svc-secret
spec:
  path: kvv2/arffornia/staging/svc
  vaultRole: arffornia-slot-role
  keys:
    - SVC_ID
    - SVC_PASSWORD
  templates:
    CFG_SVC_ID: "{% .Secrets.SVC_ID %}"
    CFG_SVC_PASSWORD: "{% .Secrets.SVC_PASSWORD %}"
  type: Opaque
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: slot-db-secret
spec:
  path: kvv2/arffornia/staging/db
  vaultRole: arffornia-slot-role
  keys:
    - username
    - password
  templates:
    CFG_DB_USERNAME: "{% .Secrets.username %}"
    CFG_DB_PASSWORD: "{% .Secrets.password %}"
  type: Opaque
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: slot-server-secret
spec:
  path: kvv2/arffornia/slot/server
  vaultRole: arffornia-slot-role
  keys:
    - CFG_RCON_PASSWORD
  type: Opaque
