replicaCount: 1

# Images are released from Arffornia_Website: a vX.Y.Z tag builds laravel-X.Y.Z and
# nginx-X.Y.Z (build-and-push-images.yml), main only moves :latest. Both images come from the
# same tag and must stay on the same version. Renovate opens the bump PR (renovate.json).
# Releases: https://github.com/Arffornia/Arffornia_Website/tags
images:
  # Image of the front / web server used (default nginx)
  frontend:
    repository: ghcr.io/arffornia/nginx_arffornia_website
    pullPolicy: IfNotPresent
    # renovate: datasource=docker depName=ghcr.io/arffornia/nginx_arffornia_website versioning=regex:^nginx-(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
    tag: "nginx-0.2.0"

  # Image of the Laravel app used
  backend:
    repository: ghcr.io/arffornia/arffornia_website
    pullPolicy: IfNotPresent
    # renovate: datasource=docker depName=ghcr.io/arffornia/arffornia_website versioning=regex:^laravel-(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
    tag: "laravel-0.2.0"
    port: 9000
    host: "127.0.0.1"

syncServiceAccounts:
  enabled: true

migrateAndSeedDB:
  enabled: false

envFrom:
  - secretRef:
      name: arffornia-website-secret
  - secretRef:
      name: arffornia-website-secret-template
  - secretRef:
      name: arffornia-db-secret
  - secretRef:
      name: arffornia-svc-secret
  - secretRef:
      name: arffornia-svc-proxy-secret

  - configMapRef:
      name: arffornia-website-config

ingress:
  enabled: false

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

itemTextures:
  persistence:
    storageClass: "longhorn"
