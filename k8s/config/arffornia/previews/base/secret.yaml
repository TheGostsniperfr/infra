# Throwaway values shared by pr1-pr3 (Terraform: terraform/playtest.tf). Kyverno refuses any
# other role or path in these namespaces, and the playtest AppProject cannot create VaultSecrets.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: website-secret
spec:
  path: kvv2/arffornia/previews/website
  vaultRole: arffornia-previews-role
  keys:
    - APP_KEY
    - AZURE_OAUTH_CLIENT_ID
    - AZURE_OAUTH_CLIENT_SECRET
  templates:
    APP_KEY: "{% .Secrets.APP_KEY %}"
    AZURE_OAUTH_CLIENT_ID: "{% .Secrets.AZURE_OAUTH_CLIENT_ID %}"
    AZURE_OAUTH_CLIENT_SECRET: "{% .Secrets.AZURE_OAUTH_CLIENT_SECRET %}"
  type: Opaque
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: db-secret
spec:
  path: kvv2/arffornia/previews/website
  vaultRole: arffornia-previews-role
  keys:
    - DB_PASSWORD
  templates:
    DB_USERNAME: "arffornia"
    DB_PASSWORD: "{% .Secrets.DB_PASSWORD %}"
    POSTGRES_USER: "arffornia"
    POSTGRES_PASSWORD: "{% .Secrets.DB_PASSWORD %}"
  type: Opaque
