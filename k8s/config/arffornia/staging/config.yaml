apiVersion: v1
kind: ConfigMap
metadata:
  name: arffornia-website-config
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  APP_NAME: "Arffornia Staging"
  APP_ENV: "staging"
  APP_DEBUG: "false"
  APP_TIMEZONE: "UTC"
  APP_URL: "https://staging.arffornia.com"

  APP_LOCALE: "en"
  APP_FALLBACK_LOCALE: "en"
  APP_FAKER_LOCALE: "en_US"

  APP_MAINTENANCE_DRIVER: "file"
  BCRYPT_ROUNDS: "12"

  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "info"

  # The in-namespace database (postgres.yaml), seed data only.
  DB_CONNECTION: "pgsql"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_DATABASE: "arffornia"

  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  SESSION_PATH: "/"
  SESSION_DOMAIN: "null"

  # No Pusher or Reverb off prod: broadcasts go to the log.
  BROADCAST_CONNECTION: "log"
  FILESYSTEM_DISK: "local"
  QUEUE_CONNECTION: "database"
  CACHE_STORE: "database"
  CACHE_PREFIX: "staging"

  # The "Arffornia Test" Microsoft app (D7); its id and secret come from Vault, empty until it exists.
  AZURE_OAUTH_REDIRECT_URI: "https://staging.arffornia.com/login/connect"
