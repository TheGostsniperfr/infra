apiVersion: v1
kind: Namespace
metadata:
  name: arffornia-staging
  labels:
    prod-gateway-access: "true"
    # Test environment: Kyverno adds a LimitRange and default-deny NetworkPolicies, pins the
    # images, the hostnames (staging.arffornia.com) and the Vault paths (staging only).
    arffornia.com/env: staging
