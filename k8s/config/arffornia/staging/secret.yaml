# Staging values only (Terraform: terraform/playtest.tf). Kyverno refuses any other role or path
# in this namespace.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: website-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  path: kvv2/arffornia/staging/website
  vaultRole: arffornia-staging-role
  keys:
    - APP_KEY
    - AZURE_OAUTH_CLIENT_ID
    - AZURE_OAUTH_CLIENT_SECRET
  type: Opaque
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: db-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  path: kvv2/arffornia/staging/db
  vaultRole: arffornia-staging-role
  keys:
    - username
    - password
  templates:
    DB_USERNAME: "{% .Secrets.username %}"
    DB_PASSWORD: "{% .Secrets.password %}"
    POSTGRES_USER: "{% .Secrets.username %}"
    POSTGRES_PASSWORD: "{% .Secrets.password %}"
  type: Opaque
---
# The test slot's account on the staging API, synced at website start (app:sync-service-accounts).
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: svc-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  path: kvv2/arffornia/staging/svc
  vaultRole: arffornia-staging-role
  keys:
    - SVC_ID
    - SVC_PASSWORD
  templates:
    SVC_ACCOUNT_MINECRAFT_NAME: "Test slot server"
    SVC_ACCOUNT_MINECRAFT_ROLES: "progression_editor,user_editor,team_editor"
    SVC_ACCOUNT_MINECRAFT_CLIENT_ID: "{% .Secrets.SVC_ID %}"
    SVC_ACCOUNT_MINECRAFT_CLIENT_SECRET: "{% .Secrets.SVC_PASSWORD %}"
  type: Opaque
