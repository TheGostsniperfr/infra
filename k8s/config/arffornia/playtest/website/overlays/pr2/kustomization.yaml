apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: arffornia-pr2

resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: arffornia-website-config
    patch: |-
      - op: replace
        path: /data/APP_URL
        value: https://pr2.arffornia.com
      - op: replace
        path: /data/AZURE_OAUTH_REDIRECT_URI
        value: https://pr2.arffornia.com/login/connect
  - target:
      kind: HTTPRoute
      name: website
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: [pr2.arffornia.com]
