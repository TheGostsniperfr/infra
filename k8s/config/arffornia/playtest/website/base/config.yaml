apiVersion: v1
kind: ConfigMap
metadata:
  name: arffornia-website-config
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  APP_NAME: "Arffornia Playtest"
  APP_ENV: "staging"
  APP_DEBUG: "false"
  APP_TIMEZONE: "UTC"
  APP_URL: "https://unset.arffornia.com"
  APP_LOCALE: "en"
  APP_FALLBACK_LOCALE: "en"
  APP_FAKER_LOCALE: "en_US"
  APP_MAINTENANCE_DRIVER: "file"
  BCRYPT_ROUNDS: "12"
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "info"
  DB_CONNECTION: "pgsql"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_DATABASE: "arffornia"
  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  SESSION_PATH: "/"
  SESSION_DOMAIN: "null"
  BROADCAST_CONNECTION: "log"
  FILESYSTEM_DISK: "local"
  QUEUE_CONNECTION: "database"
  CACHE_STORE: "database"
  CACHE_PREFIX: "playtest"
  # The "Arffornia Test" Microsoft app (D7) has a redirect URI per slot.
  AZURE_OAUTH_REDIRECT_URI: "https://unset.arffornia.com/login/connect"
