# Kyverno allows exactly pr<k>.arffornia.com in arffornia-pr<k>; each overlay sets it.
# The API server's defaults are written out (group, kind, weight, match), or Argo shows the
# route OutOfSync forever.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: website
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gateway
      namespace: gateway-infra
  hostnames:
    - unset.arffornia.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: arffornia-website-chart
          port: 80
          weight: 1
