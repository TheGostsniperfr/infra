# Kyverno allows exactly pr<k>.arffornia.com in arffornia-pr<k>; each overlay sets it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: website
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway-infra
  hostnames:
    - unset.arffornia.com
  rules:
    - backendRefs:
        - name: arffornia-website-chart
          port: 80
