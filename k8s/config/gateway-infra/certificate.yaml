apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: arffornia-wildcard-cert
  namespace: gateway-infra
spec:
  secretName: arffornia-wildcard-tls
  issuerRef:
    name: default-issuer
    kind: ClusterIssuer
  dnsNames:
    - "arffornia.com"
    - "*.arffornia.com"
    - "*.coder.arffornia.com"
