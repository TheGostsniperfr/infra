# Every plain HTTP request gets a 301 to HTTPS. Before this, apps answered in clear text on port
# 80, and the apps behind secure-route's OIDC looped: the session cookie is Secure, so the browser
# never sent it back on http:// and Envoy restarted the login forever.
# Requires Cloudflare in Full (strict) mode (terraform/dns.tf), otherwise proxied names loop.
# https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: gateway-infra
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: http-wildcard
    - name: shared-gateway
      sectionName: http-arffornia
  hostnames:
    - "*.arffornia.com"
    - "arffornia.com"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
