replicas: 1

enableServiceLinks: false

image:
  repository: quay.io/keycloak/keycloak
  tag: "26.5.5"

rbac:
  create: false
  rules: []

proxy:
  enabled: true
  mode: xforwarded
  http:
    enabled: true

http:
  relativePath: "/"

metrics:
  enabled: true

health:
  enabled: true

# Metrics on the management port: logins, errors, HTTP latency
# Feature: https://www.keycloak.org/observability/configuration-metrics
serviceMonitor:
  enabled: true

autoscaling:
  enabled: false

resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    memory: "1Gi"

readinessProbe: |
  httpGet:
    path: "/health/ready"
    port: "http-internal"
    scheme: "HTTP"
  initialDelaySeconds: 30
  timeoutSeconds: 1
startupProbe: |
  httpGet:
    path: "/health"
    port: "http-internal"
    scheme: "HTTP"
  initialDelaySeconds: 30
  timeoutSeconds: 1
  failureThreshold: 60
  periodSeconds: 5

database:
  vendor: postgres
  existingSecret: keycloak-db-secret
  existingSecretKey: password
  hostname: keycloak-rw
  port: 5432
  database: keycloak
  username: keycloak

command:
  - "/opt/keycloak/bin/kc.sh"
  - "start"
  - "--http-port=8080"

extraEnv: |
  - name: KC_PROXY
    value: edge
  - name: KC_HOSTNAME
    value: "https://auth.arffornia.com"
  - name: KC_HOSTNAME_ADMIN
    value: "https://admin-auth.arffornia.com"
  - name: KC_HOSTNAME_STRICT
    value: "true"
  - name: KC_HOSTNAME_STRICT_HTTPS
    value: "true"
  - name: KEYCLOAK_ADMIN
    value: admin
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin-password
        key: password
  - name: JAVA_OPTS_APPEND
    value: >-
      -Djgroups.dns.query=keycloak-keycloakx-headless

extraVolumes: |
  - name: theme-providers
    emptyDir: {}

extraVolumeMounts: |
  - name: theme-providers
    mountPath: /opt/keycloak/providers

extraInitContainers: |
  # Login and account theme JAR: https://github.com/Arffornia/keycloak-theme-arffornia
  - name: theme-provider-init
    image: ghcr.io/arffornia/keycloak-theme-arffornia:1.2.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - name: theme-providers
        mountPath: /providers
