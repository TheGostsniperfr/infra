garage:
  replicationFactor: 1
deployment:
  replicaCount: 1
persistence:
  meta:
    storageClass: "longhorn"
    size: 2Gi
  data:
    storageClass: "longhorn"
    size: 20Gi
ingress:
  s3:
    api:
      enabled: false
  web:
    enabled: false
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Admin API /metrics on 3903: cluster health, disk space left, S3 request errors.
# No metrics_token is set, so the endpoint is open inside the cluster.
# Feature: https://garagehq.deuxfleurs.fr/documentation/reference-manual/monitoring/
monitoring:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
