garage:
  replicationFactor: 1
  # Single node: a corrupted metadata DB cannot be rebuilt from peers (happened on 2026-11-10
  # after a power cut, see README). fsync trades write speed for crash safety, and snapshots
  # give a consistent copy to restore. Snapshots land in /mnt/meta/snapshots, the last two are kept.
  # https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#metadata_fsync
  # https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#metadata_auto_snapshot_interval
  metadataAutoSnapshotInterval: "6h"
  additionalTopLevelConfig: |
    metadata_fsync = true
deployment:
  replicaCount: 1
persistence:
  meta:
    storageClass: "longhorn"
    size: 2Gi
  data:
    storageClass: "longhorn"
    size: 20Gi
ingress:
  s3:
    api:
      enabled: false
  web:
    enabled: false
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Admin API /metrics on 3903: cluster health, disk space left, S3 request errors.
# No metrics_token is set, so the endpoint is open inside the cluster.
# Feature: https://garagehq.deuxfleurs.fr/documentation/reference-manual/monitoring/
monitoring:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
