# LoadBalancer service so the workstation runner can reach PostgreSQL on a LAN IP.
# LAN only, no router rule.
apiVersion: v1
kind: Service
metadata:
  name: postgres-lb
  namespace: postgres
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.1.246
spec:
  type: LoadBalancer
  selector:
    cluster-name: postgres-cluster
    spilo-role: master
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
