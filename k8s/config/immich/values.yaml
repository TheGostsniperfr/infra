# Immich helm chart values
# Chart: https://immich-app.github.io/immich-charts
# Values reference: https://github.com/immich-app/immich-charts/blob/main/charts/immich/values.yaml

immich:
  metrics:
    enabled: false
  persistence:
    library:
      existingClaim: "immich-library-pvc"

# Shared config applied to all Immich components (server + formerly microservices)
controllers:
  main:
    containers:
      main:
        image:
          tag: "v3.1.0"
        env:
          IMMICH_SECRET_KEY:
            valueFrom:
              secretKeyRef:
                name: immich-secret-key
                key: value
          REDIS_HOSTNAME: "immich-redis.immich.svc.cluster.local"
          DB_HOSTNAME: "immich-postgres.immich.svc.cluster.local"
          DB_PORT: "5432"
          DB_DATABASE_NAME: "immich"
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-db-secret
                key: username
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-db-secret
                key: password
          DB_VECTOR_EXTENSION: pgvector

valkey:
  enabled: false # use standalone redis:7-alpine deployment

server:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            pullPolicy: Always
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "6Gi"
  ingress:
    main:
      enabled: false
  persistence:
    photos:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-photos-pvc
      globalMounts:
        - path: /mnt/photos
          readOnly: true
    phone-photos:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-phone-photos-pvc
      globalMounts:
        - path: /mnt/phone-photos
          readOnly: true
    phone-videos:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-phone-videos-pvc
      globalMounts:
        - path: /mnt/phone-videos
          readOnly: true

machine-learning:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 10Gi
      storageClass: longhorn
      globalMounts:
        - path: /cache
