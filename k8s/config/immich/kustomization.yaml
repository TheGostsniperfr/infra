apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: immich

resources:
  - namespace.yaml
  - secret.yaml
  - nas-pv.yaml
  - immich-library-pvc.yaml
  - redis.yaml

helmGlobals:
  chartHome: ../../../charts

helmCharts:
  - name: immich
    repo: https://immich-app.github.io/immich-charts
    version: "0.9.0"
    releaseName: immich
    namespace: immich
    valuesFile: values.yaml

  - name: secure-route
    releaseName: immich-routes
    namespace: immich
    valuesFile: values-secure-route.yaml
