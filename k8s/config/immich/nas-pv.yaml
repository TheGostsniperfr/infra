# SMB mount of the Nextcloud photos directory — read-only for Immich external library.
# Same NAS server as Nextcloud (192.168.1.49) but scoped to /nextcloud/photos only.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-nas-photos-immich
spec:
  capacity:
    storage: 200Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smb-nas
  mountOptions:
    - "uid=1000"
    - "gid=1000"
    - "vers=3.0"
    - "dir_mode=0755"
    - "file_mode=0644"
    - "cache=strict"
    - "noserverino"
  csi:
    driver: smb.csi.k8s.io
    readOnly: true
    volumeHandle: pv-nas-photos-immich-handle
    volumeAttributes:
      source: "//192.168.1.49/raid5_proxmox/nextcloud/photos"
    nodeStageSecretRef:
      name: smb-nas-credentials
      namespace: default
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-photos-pvc
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  storageClassName: smb-nas
  volumeName: pv-nas-photos-immich
