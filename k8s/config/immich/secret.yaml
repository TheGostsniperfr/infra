# Vault path: kvv2/postgres/immich  keys: username, password
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: immich-db-secret
  namespace: immich
spec:
  path: kvv2/postgres/immich
  vaultRole: immich-role
  keys:
    - username
    - password
  type: Opaque
---
# Random secret key for Immich session tokens (generate: openssl rand -hex 32)
# Vault path: kvv2/immich/secret-key  key: value
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: immich-secret-key
  namespace: immich
spec:
  path: kvv2/immich/secret-key
  vaultRole: immich-role
  keys:
    - value
  type: Opaque
