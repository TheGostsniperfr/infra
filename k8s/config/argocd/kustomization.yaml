apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - github.com/argoproj/argo-cd/manifests/cluster-install?ref=v3.3.9
  - https://raw.githubusercontent.com/argoproj-labs/argocd-image-updater/stable/config/install.yaml
  - apps.yaml
  - secrets.yaml

patches:
  # argocd-secret is generated by the VaultSecret in secrets.yaml (Merge keeps server.secretkey):
  # the empty Secret of the install manifests made two sources for one object, always OutOfSync.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-secret
  - path: patch-argocd-cm.yaml
  - path: argocd-cmd-params-cm-patch.yaml
  - path: patch-argocd-rbac-cm.yaml
  - path: patch-argocd-server-service.yaml

helmGlobals:
  chartHome: ../../../charts

helmCharts:
  - name: secure-route
    releaseName: argocd-routes
    namespace: argocd
    valuesFile: values-secure-route.yaml
