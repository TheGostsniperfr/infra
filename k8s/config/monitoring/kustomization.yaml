apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - secret.yaml
  - namespace.yaml
  - alertmanager-config.yaml
  - alertmanager-heartbeat.yaml
  - rules/nodes-and-containers.yaml
  - rules/platform.yaml

# Our dashboards, loaded by the Grafana sidecar from any ConfigMap labelled grafana_dashboard=1.
# Edit the JSON (export from Grafana: Share > Export, uid kept) rather than the UI: provisioned
# dashboards are read-only there.
configMapGenerator:
  - name: dashboard-homelab-overview
    files:
      - dashboards/homelab-overview.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Homelab
  - name: dashboard-arffornia-live
    files:
      - dashboards/arffornia-live.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Arffornia
  - name: dashboard-arffornia-business
    files:
      - dashboards/arffornia-business.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Arffornia

generatorOptions:
  disableNameSuffixHash: true

helmGlobals:
  chartHome: ../../../charts

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: "80.14.4"
    releaseName: kube-prometheus-stack
    namespace: monitoring
    valuesFile: values.yaml
    includeCRDs: true

  - name: secure-route
    releaseName: monitoring-routes
    namespace: monitoring
    valuesFile: values-secure-route.yaml
