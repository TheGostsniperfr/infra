# Dead man's switch: the Watchdog alert always fires, Alertmanager forwards it every 5 minutes
# to healthchecks.io, which notifies when the pings stop: Prometheus, Alertmanager, the node
# or the whole cluster is down, a case no in-cluster alert can report.
# Separate from discord-config on purpose: if its Secret is missing, the operator rejects only
# this AlertmanagerConfig and the Discord routes keep working.
# Feature: https://healthchecks.io/docs/
# Chart: https://prometheus-operator.dev/docs/api-reference/api/#monitoring.coreos.com/v1alpha1.WebhookConfig
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: watchdog-heartbeat
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: healthchecks
    matchers:
      - name: alertname
        value: Watchdog
    groupWait: 0s
    groupInterval: 1m
    repeatInterval: 5m
  receivers:
    - name: healthchecks
      webhookConfigs:
        - urlSecret:
            name: alertmanager-healthchecks-secret
            key: ping_url
          sendResolved: false
