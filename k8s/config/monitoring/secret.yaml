apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: grafana-admin-creds
  namespace: monitoring
spec:
  path: kvv2/grafana/admin
  vaultRole: monitoring-role
  keys:
    - admin-user
    - admin-password
  type: Opaque
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: alertmanager-discord-secret
  namespace: monitoring
spec:
  path: kvv2/monitoring/discord
  vaultRole: monitoring-role
  keys:
    - webhook_general
    - webhook_critical
    - webhook_arffornia
  type: Opaque
---
# Vault path: kvv2/monitoring/grafana-arffornia-db  keys: password
# Exposed to Grafana as GRAFANA_ARFFORNIA_DB_PASSWORD for the "Arffornia DB" datasource
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: grafana-arffornia-db
  namespace: monitoring
spec:
  path: kvv2/monitoring/grafana-arffornia-db
  vaultRole: monitoring-role
  keys:
    - password
  templates:
    GRAFANA_ARFFORNIA_DB_PASSWORD: "{% .Secrets.password %}"
  type: Opaque
