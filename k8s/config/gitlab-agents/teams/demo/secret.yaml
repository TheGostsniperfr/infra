# Agent token, created by Terraform (gitlab_cluster_agent_token.team["demo"])
# Vault path: kvv2/gitlab-agents/demo  keys: token
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: gitlab-agent-token
  namespace: gitlab-agent-demo
spec:
  path: kvv2/gitlab-agents/demo
  vaultRole: gitlab-agents-role
  keys:
    - token
  type: Opaque
