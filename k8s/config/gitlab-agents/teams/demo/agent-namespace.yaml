# Namespace of team demo's agent. The agent only needs leader election in its own namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-agent-demo
  labels:
    team: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-agent-self
  namespace: gitlab-agent-demo
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-agent-self
  namespace: gitlab-agent-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-agent-self
subjects:
  - kind: ServiceAccount
    name: gitlab-agent-demo
    namespace: gitlab-agent-demo
