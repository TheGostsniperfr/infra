# Secrets reference: https://docs.gitlab.com/charts/installation/secrets/

# Vault path: kvv2/postgres/gitlab  keys: username, password
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: gitlab-db-secret
  namespace: gitlab
spec:
  path: kvv2/postgres/gitlab
  vaultRole: gitlab-role
  keys:
    - username
    - password
  type: Opaque
---
# Vault path: kvv2/gitlab/redis  key: password
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: gitlab-redis-secret
  namespace: gitlab
spec:
  path: kvv2/gitlab/redis
  vaultRole: gitlab-role
  keys:
    - password
  type: Opaque
---
# Garage key `gitlab-key`. Vault path: kvv2/gitlab/s3  keys: access_key, secret_key
# Rendered three times, once per format: Rails (fog), the registry and the toolbox backups (s3cmd).
# Rails: https://docs.gitlab.com/charts/advanced/external-object-storage/#configure-object-storage-for-gitlab-features
# Registry (s3_v2 driver): https://gitlab.com/gitlab-org/container-registry/-/blob/master/docs/storage-drivers/s3_v2.md
# Backups: https://docs.gitlab.com/charts/advanced/external-object-storage/#backups
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: gitlab-object-storage
  namespace: gitlab
spec:
  path: kvv2/gitlab/s3
  vaultRole: gitlab-role
  keys:
    - access_key
    - secret_key
  templates:
    connection: |
      provider: AWS
      region: garage
      aws_access_key_id: {% .Secrets.access_key %}
      aws_secret_access_key: {% .Secrets.secret_key %}
      endpoint: http://garage.garage-s3.svc.cluster.local:3900
      path_style: true
  type: Opaque
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: gitlab-registry-storage
  namespace: gitlab
spec:
  path: kvv2/gitlab/s3
  vaultRole: gitlab-role
  keys:
    - access_key
    - secret_key
  templates:
    config: |
      s3_v2:
        bucket: gitlab-registry
        accesskey: {% .Secrets.access_key %}
        secretkey: {% .Secrets.secret_key %}
        region: garage
        regionendpoint: http://garage.garage-s3.svc.cluster.local:3900
        secure: false
        checksum_disabled: true
  type: Opaque
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: gitlab-backup-storage
  namespace: gitlab
spec:
  path: kvv2/gitlab/s3
  vaultRole: gitlab-role
  keys:
    - access_key
    - secret_key
  templates:
    config: |
      [default]
      access_key = {% .Secrets.access_key %}
      secret_key = {% .Secrets.secret_key %}
      bucket_location = garage
      host_base = garage.garage-s3.svc.cluster.local:3900
      host_bucket = garage.garage-s3.svc.cluster.local:3900
      use_https = False
      signature_v2 = False
  type: Opaque
---
# Keycloak client `gitlab`, secret pushed to Vault by Terraform.
# Provider options: https://docs.gitlab.com/administration/auth/oidc/#configure-keycloak
# Vault path: kvv2/gitlab/oidc  key: client_secret
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: gitlab-oidc
  namespace: gitlab
spec:
  path: kvv2/gitlab/oidc
  vaultRole: gitlab-role
  keys:
    - client_secret
  templates:
    provider: |
      name: openid_connect
      label: Keycloak
      args:
        name: openid_connect
        scope: [openid, profile, email]
        response_type: code
        issuer: https://auth.arffornia.com/realms/arffornia
        discovery: true
        client_auth_method: query
        uid_field: preferred_username
        pkce: true
        client_options:
          identifier: gitlab
          secret: {% .Secrets.client_secret %}
          redirect_uri: https://gitlab.arffornia.com/users/auth/openid_connect/callback
  type: Opaque
---
# Instance runner authentication token (glrt-...), created in the GitLab UI after the first boot.
# https://docs.gitlab.com/charts/installation/secrets/#gitlab-runner-secret
# Vault path: kvv2/gitlab/runner  key: runner_token
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: gitlab-runner-token
  namespace: gitlab
spec:
  path: kvv2/gitlab/runner
  vaultRole: gitlab-role
  keys:
    - runner_token
  templates:
    runner-token: "{% .Secrets.runner_token %}"
    runner-registration-token: ""
  type: Opaque
---
# -----------------------------------------------------------------------------
# Internal secrets, normally generated by the chart's shared-secrets job.
# Names are the chart defaults. All generated by Terraform (secret_templates.tf).
# Formats: https://docs.gitlab.com/charts/installation/secrets/#manual-secret-creation-optional
# -----------------------------------------------------------------------------
# Rails keys: they encrypt database columns, a restore needs the same ones
# https://docs.gitlab.com/charts/installation/secrets/#gitlab-rails-secret
