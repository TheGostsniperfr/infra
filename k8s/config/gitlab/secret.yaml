# Host keys of gitlab-shell: stable across rebuilds, so clients never see a changed fingerprint
# Vault path: kvv2/gitlab/shell-host-keys
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: gitlab-gitlab-shell-host-keys
  namespace: gitlab
spec:
  path: kvv2/gitlab/shell-host-keys
  vaultRole: gitlab-role
  keys:
    - ssh_host_rsa_key
    - ssh_host_rsa_key.pub
    - ssh_host_ecdsa_key
    - ssh_host_ecdsa_key.pub
    - ssh_host_ed25519_key
    - ssh_host_ed25519_key.pub
  type: Opaque
---
