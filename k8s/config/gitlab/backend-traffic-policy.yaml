# Envoy closes idle streams after 5 min by default: a git clone that is still packing on
# the server side would be cut. Same values as the GitLab chart's own Gateway API mode.
# Chart: https://docs.gitlab.com/charts/charts/gitlab/webservice/
# Envoy Gateway: https://gateway.envoyproxy.io/v1.7/api/extension_types/#httptimeout
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gitlab-webservice
  namespace: gitlab
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gitlab-route
  timeout:
    http:
      streamIdleTimeout: 3600s
    tcp:
      connectTimeout: 300s
