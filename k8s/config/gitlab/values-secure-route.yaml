# Same routes as the chart's own Gateway API mode, see the HTTPRoute templates of each subchart:
# https://gitlab.com/gitlab-org/charts/gitlab/-/tree/v10.5.4/charts/gitlab/charts

routes:
  gitlab:
    hostnames:
      - "gitlab.arffornia.com"
    rules:
      # No timeout: long git clone/push and CI log streaming over HTTPS. Envoy Gateway 1.7 has
      # no per-route stream idle timeout (only ClientTrafficPolicy, shared by every app), so a
      # silent stream over 5 min (Envoy default) is still cut.
      - backendRefs:
          - name: gitlab-webservice-default
            port: 8181
        timeouts:
          request: 0s
          backendRequest: 0s
    auth:
      enabled: false # GitLab has its own auth (Keycloak OIDC)
    ipFilter:
      enabled: false

  gitlab-registry:
    hostnames:
      - "gitlab-registry.arffornia.com"
    rules:
      - backendRefs:
          - name: gitlab-registry
            port: 5000
        timeouts:
          request: 900s
          backendRequest: 900s
    auth:
      enabled: false # Registry tokens are issued by GitLab
    ipFilter:
      enabled: false

  # Agent for Kubernetes: long-lived websocket on /, kubectl proxy (exec, logs) on /k8s-proxy
  # https://docs.gitlab.com/charts/charts/gitlab/kas/#agent-connection-protocol
  # https://docs.gitlab.com/user/clusters/agent/user_access/
  gitlab-kas:
    hostnames:
      - "gitlab-kas.arffornia.com"
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /k8s-proxy
        backendRefs:
          - name: gitlab-kas
            port: 8154
        timeouts:
          request: 2h
          backendRequest: 2h
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - name: gitlab-kas
            port: 8150
        timeouts:
          request: 0s
    auth:
      enabled: false # Agents authenticate with their own token
    ipFilter:
      enabled: false
