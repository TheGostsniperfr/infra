apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitlab

resources:
  - namespace.yaml
  - secret.yaml
  - redis.yaml
  - backend-traffic-policy.yaml

helmGlobals:
  chartHome: ../../../charts

helmCharts:
  - name: gitlab
    repo: https://charts.gitlab.io
    version: "10.5.4"
    releaseName: gitlab
    namespace: gitlab
    valuesFile: values.yaml

  - name: secure-route
    releaseName: gitlab-routes
    namespace: gitlab
    valuesFile: values-secure-route.yaml
