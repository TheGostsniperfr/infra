# GitLab helm chart values
# Chart: https://docs.gitlab.com/charts/
# Values reference: https://gitlab.com/gitlab-org/charts/gitlab/-/blob/v10.5.4/values.yaml
# Global settings: https://docs.gitlab.com/charts/charts/globals/
# Release notes 10.0: https://docs.gitlab.com/charts/releases/10_0/
#
# Since chart 10.x (GitLab 19) PostgreSQL, Redis and MinIO are no longer bundled:
# PostgreSQL is the shared postgres-cluster, Redis is redis.yaml, object storage is Garage.
# Every secret comes from Vault (secret.yaml), generated by Terraform: the chart's
# shared-secrets job is disabled so a rebuild from scratch gets the same keys back.
# Routes are in values-secure-route.yaml.

global:
  # EE without a license runs the free tier, a trial license unlocks Premium/Ultimate features
  # Chart: https://docs.gitlab.com/charts/installation/deployment/#deploy-the-community-edition
  # Tiers: https://about.gitlab.com/pricing/feature-comparison/
  edition: ee
  time_zone: Europe/Paris

  # Chart: https://docs.gitlab.com/charts/charts/globals/#configure-host-settings
  hosts:
    domain: arffornia.com
    https: true
    gitlab:
      name: gitlab.arffornia.com
    registry:
      name: gitlab-registry.arffornia.com
    kas:
      name: gitlab-kas.arffornia.com
    # SSH clone URLs: ssh://git@gitlab-ssh.arffornia.com:5522/<group>/<project>.git
    ssh: gitlab-ssh.arffornia.com

  # Routing is done by secure-route on the shared-gateway, not by the chart
  # Chart: https://docs.gitlab.com/charts/charts/globals/#gateway-api
  gatewayApi:
    enabled: false
    installEnvoy: false
  ingress:
    enabled: false
    # TLS is terminated by the shared-gateway with a public certificate. Without this the chart
    # assumes a self-signed one and mounts its CA (gitlab-wildcard-tls-ca) in every pod.
    tls:
      enabled: true

  # PostgreSQL: database `gitlab` on the shared Zalando cluster. GitLab 19 needs PostgreSQL 17+
  # and the amcheck, btree_gist and pg_trgm extensions.
  # Chart: https://docs.gitlab.com/charts/advanced/external-db/
  # Requirements: https://docs.gitlab.com/install/requirements/#postgresql
  # Extensions: https://docs.gitlab.com/administration/postgresql/extensions/
  psql:
    host: postgres-cluster.postgres.svc.cluster.local
    port: 5432
    database: gitlab
    username: gitlab
    password:
      secret: gitlab-db-secret
      key: password

  # Redis: cache, sessions and Sidekiq queues
  # Chart: https://docs.gitlab.com/charts/advanced/external-redis/
  # Requirements: https://docs.gitlab.com/install/requirements/#redis-or-valkey
  redis:
    host: gitlab-redis.gitlab.svc.cluster.local
    port: 6379
    auth:
      enabled: true
      secret: gitlab-redis-secret
      key: password

  # KAS: server side of the GitLab agent for Kubernetes
  # Feature: https://docs.gitlab.com/user/clusters/agent/
  # Chart: https://docs.gitlab.com/charts/charts/gitlab/kas/
  kas:
    enabled: true

  # Runner: authentication token from Vault, not the deprecated registration token
  # Chart: https://docs.gitlab.com/charts/installation/secrets/#gitlab-runner-secret
  # Same port inside and outside: the router forwards TCP 5522 to 192.168.1.240:5522
  shell:
    port: 5522

  runner:
    registrationToken:
      secret: gitlab-runner-token

  appConfig:
    # Object storage: one Garage connection, one bucket per data type
    # Feature: https://docs.gitlab.com/administration/object_storage/
    # Chart: https://docs.gitlab.com/charts/advanced/external-object-storage/
    # Buckets: https://docs.gitlab.com/charts/charts/globals/#consolidated-object-storage
    object_store:
      enabled: true
      connection:
        secret: gitlab-object-storage
        key: connection
    # https://docs.gitlab.com/topics/git/lfs/
    lfs:
      bucket: gitlab-lfs
    # https://docs.gitlab.com/ci/jobs/job_artifacts/
    artifacts:
      bucket: gitlab-artifacts
    uploads:
      bucket: gitlab-uploads
    # https://docs.gitlab.com/user/packages/package_registry/
    packages:
      bucket: gitlab-packages
    # GitLab as Terraform/OpenTofu state backend
    # https://docs.gitlab.com/user/infrastructure/iac/terraform_state/
    terraformState:
      enabled: true
      bucket: gitlab-terraform-state
    # Files (certificates, keystores...) available to CI jobs without committing them
    # https://docs.gitlab.com/ci/secure_files/
    ciSecureFiles:
      enabled: true
      bucket: gitlab-ci-secure-files
    # Pull-through cache for Docker Hub images used in CI
    # https://docs.gitlab.com/user/packages/dependency_proxy/
    dependencyProxy:
      enabled: true
      bucket: gitlab-dependency-proxy
    # Chart: https://docs.gitlab.com/charts/advanced/external-object-storage/#backups
    backups:
      bucket: gitlab-backups
      tmpBucket: gitlab-tmp

    # Applied on the first install only, then managed in Admin > Settings > General
    initialDefaults:
      signupEnabled: false

    # SSO: Keycloak realm `arffornia`. Users are created on first login, blocked until an admin
    # approves them (Admin > Users > Pending approval): every realm user could sign in otherwise,
    # and run jobs on the shared runner.
    # The sign-in page redirects to Keycloak; root signs in at /users/sign_in?auto_sign_in=false
    # Feature: https://docs.gitlab.com/administration/auth/oidc/#configure-keycloak
    # Options: https://docs.gitlab.com/integration/omniauth/
    # Chart: https://docs.gitlab.com/charts/charts/globals/#omniauth
    omniauth:
      enabled: true
      autoSignInWithProvider: openid_connect
      allowSingleSignOn: [openid_connect]
      blockAutoCreatedUsers: true
      autoLinkUser: [openid_connect]
      syncProfileFromProvider: [openid_connect]
      syncProfileAttributes: [email]
      providers:
        - secret: gitlab-oidc
          key: provider

# Chart: https://docs.gitlab.com/charts/installation/secrets/#manual-secret-creation-optional
shared-secrets:
  enabled: false

# Already provided by the cluster: cert-manager, Prometheus (kube-prometheus-stack)
installCertmanager: false
prometheus:
  install: false

# GitLab components, scaled to one replica each (lab)
# Resources: requests are the chart defaults. Memory limits only: a CPU limit throttles Rails
# for nothing, a memory limit keeps a leak from starving the node (Burstable QoS).
# Limits marked "chart" come from the chart's commented suggestions, the others are estimates.
# QoS: https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/
gitlab:
  # Rails web app and API, behind Workhorse
  # Chart: https://docs.gitlab.com/charts/charts/gitlab/webservice/
  webservice:
    minReplicas: 1
    maxReplicas: 1
    helmTests:
      enabled: false # Helm test Pod gets a random name on every render, Argo CD never converges
    resources:
      limits:
        memory: 4G # Measured 2.7Gi idle with 2 Puma workers: the chart's 3G gets OOMKilled
    workhorse:
      resources:
        limits:
          memory: 512Mi

  # Background jobs
  # Chart: https://docs.gitlab.com/charts/charts/gitlab/sidekiq/
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    resources:
      limits:
        memory: 5G # chart

  # Chart: https://docs.gitlab.com/charts/charts/gitlab/kas/
  kas:
    minReplicas: 1
    maxReplicas: 1
    resources:
      limits:
        memory: 512Mi

  # Git repositories
  # Feature: https://docs.gitlab.com/administration/gitaly/
  # Chart: https://docs.gitlab.com/charts/charts/gitlab/gitaly/
  gitaly:
    persistence:
      storageClass: longhorn
      size: 20Gi
    resources:
      limits:
        memory: 2G # git pack-objects on large clones
    securityContext:
      seccompProfile:
        type: RuntimeDefault # The only GitLab pod without it by default

  # Git over SSH on its own MetalLB IP: SSH is not HTTP, so it cannot go through
  # secure-route. Public through the router; key auth only, user git only, no forwarding.
  # Chart: https://docs.gitlab.com/charts/charts/gitlab/gitlab-shell/
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: 192.168.1.240 # Outside the box's DHCP range (.1-.199)
    resources:
      limits:
        memory: 256Mi

  # Prometheus exporter for GitLab internals
  # Chart: https://docs.gitlab.com/charts/charts/gitlab/gitlab-exporter/
  gitlab-exporter:
    enabled: false

  # Admin pod for rake tasks and backup/restore
  # Chart: https://docs.gitlab.com/charts/charts/gitlab/toolbox/
  # Backups: https://docs.gitlab.com/charts/backup-restore/
  toolbox:
    resources:
      limits:
        memory: 2G # chart
    backups:
      objectStorage:
        config:
          secret: gitlab-backup-storage
          key: config

# Container registry (gitlab-registry.arffornia.com), images stored in the gitlab-registry bucket
# Feature: https://docs.gitlab.com/user/packages/container_registry/
# Chart: https://docs.gitlab.com/charts/charts/registry/
# Storage: https://docs.gitlab.com/charts/advanced/external-object-storage/#docker-registry-images
registry:
  hpa:
    minReplicas: 1
    maxReplicas: 1
  resources:
    limits:
      memory: 1024Mi # chart
  storage:
    secret: gitlab-registry-storage
    key: config
    # Serve blobs through the registry instead of redirecting clients to a presigned S3 URL: that
    # URL is Garage's in-cluster address, which neither nodes (kubelet pulls) nor workstations resolve
    # https://docs.gitlab.com/charts/charts/registry/#storage
    # https://gitlab.com/gitlab-org/container-registry/-/blob/master/docs/configuration.md#redirect
    redirect:
      disable: true

# Instance runner: CI jobs run as pods in this namespace
# Chart: https://docs.gitlab.com/charts/charts/gitlab/gitlab-runner/
# Executor: https://docs.gitlab.com/runner/executors/kubernetes/
# Token: https://docs.gitlab.com/ci/runners/runners_scope/#create-an-instance-runner-with-a-runner-authentication-token
gitlab-runner:
  install: true
  concurrent: 2
  resources:
    requests:
      cpu: 100m # chart
      memory: 128Mi # chart
    limits:
      memory: 256Mi # chart
  # Jobs run in gitlab-ci-jobs (ci-jobs-namespace.yaml); the runner's Role lives there only, with
  # the permissions the Kubernetes executor needs (the chart's default is every core resource)
  # https://docs.gitlab.com/runner/executors/kubernetes/#configure-runner-api-permissions
  rbac:
    create: true
    rules:
      - resources: ["pods"]
        verbs: ["create", "delete", "get", "list", "watch"]
      - resources: ["pods/attach", "pods/exec"]
        verbs: ["create", "delete", "get", "patch"]
      - resources: ["pods/log"]
        verbs: ["get", "list"]
      - resources: ["secrets"]
        verbs: ["create", "delete", "get", "update"]
      - resources: ["serviceaccounts"]
        verbs: ["get"]
      - resources: ["services"]
        verbs: ["create", "get"]
      - resources: ["events"]
        verbs: ["list", "watch"]
  # Job pods: without requests they would be BestEffort, first evicted under pressure
  runners:
    jobNamespace: gitlab-ci-jobs
    config: |
      [[runners]]
        [runners.kubernetes]
        namespace = "gitlab-ci-jobs"
        image = "alpine:3.22"
        cpu_request = "100m"
        memory_request = "256Mi"
        memory_limit = "2Gi"
