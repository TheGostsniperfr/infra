apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: photo-ai

resources:
  - namespace.yaml
  - secret.yaml
  - qdrant.yaml
  - discord-bot.yaml
  - cronjob.yaml
  - runner-external.yaml

helmGlobals:
  chartHome: ../../../charts

helmCharts:
  - name: secure-route
    releaseName: photo-ai-routes
    namespace: photo-ai
    valuesFile: values-secure-route.yaml
