# Daily batch trigger: checks if photo-ai runner is alive, then triggers scan-new.
# Runs at 03:00 every day. If runner is unreachable the job simply exits — no retries.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: photo-ai-daily-scan
  namespace: photo-ai
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trigger
              image: alpine/curl:latest
              env:
                - name: RUNNER_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: photo-ai-runner-secret
                      key: auth_token
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Checking runner availability..."
                  if ! curl -sf --max-time 5 \
                    http://photo-ai-runner.photo-ai.svc.cluster.local:8765/healthz \
                    > /dev/null; then
                    echo "Runner unreachable — workstation offline or runner not started, skipping scan."
                    exit 0
                  fi

                  echo "Runner reachable. Triggering photo-ai scan-new..."
                  curl -sf --max-time 10 \
                    -X POST \
                    -H "Authorization: Bearer ${RUNNER_AUTH_TOKEN}" \
                    -H "Content-Type: application/json" \
                    -d '{"mode":"scan-new"}' \
                    http://photo-ai-runner.photo-ai.svc.cluster.local:8765/api/run

                  echo "Trigger sent."
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
                limits:
                  memory: "32Mi"
