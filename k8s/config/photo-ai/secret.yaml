# Discord bot token + guild ID
# Vault path: kvv2/photo-ai/discord  keys: token, guild_id
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: photo-ai-discord-secret
  namespace: photo-ai
spec:
  path: kvv2/photo-ai/discord
  vaultRole: photo-ai-role
  keys:
    - token
    - guild_id
  type: Opaque
---
# Shared auth token between Discord bot and workstation runner
# Vault path: kvv2/photo-ai/runner  key: auth_token
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: photo-ai-runner-secret
  namespace: photo-ai
spec:
  path: kvv2/photo-ai/runner
  vaultRole: photo-ai-role
  keys:
    - auth_token
  type: Opaque
---
# PostgreSQL credentials (created automatically by zalando operator)
# Vault path: kvv2/postgres/photoai  keys: username, password
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: photo-ai-db-secret
  namespace: photo-ai
spec:
  path: kvv2/postgres/photoai
  vaultRole: photo-ai-role
  keys:
    - username
    - password
  type: Opaque
