# ExternalService pointing to the photo-ai runner on the workstation VM.
# Uses EndpointSlice (not Endpoints) — ArgoCD excludes raw Endpoints by default.
apiVersion: v1
kind: Service
metadata:
  name: photo-ai-runner
  namespace: photo-ai
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8765
      targetPort: 8765
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: photo-ai-runner
  namespace: photo-ai
  labels:
    kubernetes.io/service-name: photo-ai-runner
addressType: IPv4
endpoints:
  - addresses:
      - "192.168.1.20"
    conditions:
      ready: true
ports:
  - name: http
    port: 8765
    protocol: TCP
