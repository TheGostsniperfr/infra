apiVersion: v1
kind: Service
metadata:
  name: photo-ai-runner
  namespace: photo-ai
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8765
      targetPort: 8765
---
apiVersion: v1
kind: Endpoints
metadata:
  name: photo-ai-runner
  namespace: photo-ai
subsets:
  - addresses:
      - ip: "192.168.1.20"
    ports:
      - name: http
        port: 8765
        protocol: TCP
