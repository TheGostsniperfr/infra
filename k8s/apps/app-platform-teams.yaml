# App platform: one Application `team-<team>` per file k8s/config/app-platform/teams/<team>.yaml
# (the team name is the file name, never its content). Each Application renders charts/platform-team:
# per app its namespace, guardrails, Argo CD project and the Applications that deploy it (charts/app).
# The same files drive terraform/gitlab.tf and terraform/apps.tf (GitLab groups, Vault, Keycloak,
# DNS), see k8s/config/app-platform/README.md.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-platform-teams
  namespace: argocd
spec:
  # Removing a team file removes everything the team had in the cluster: its Application deletes,
  # through its finalizer, the app namespaces (databases included) and the apps' Applications.
  # Nothing is left to clean by hand. Renaming a team file is a removal plus a creation.
  # https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Application-Deletion/
  syncPolicy:
    preserveResourcesOnDeletion: false
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/TheGostsniperfr/infra.git
        revision: HEAD
        files:
          - path: k8s/config/app-platform/teams/*.yaml
  template:
    metadata:
      name: 'team-{{ trimSuffix ".yaml" .path.filename }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
    spec:
      project: default
      sources:
        - repoURL: https://github.com/TheGostsniperfr/infra.git
          targetRevision: HEAD
          path: charts/platform-team
          helm:
            releaseName: 'platform-team-{{ trimSuffix ".yaml" .path.filename }}'
            values: |
              team: {{ trimSuffix ".yaml" .path.filename }}
              apps: {{ toJson .apps }}
      destination:
        name: in-cluster
        # Every object of the chart names its namespace; this only catches one that would not
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
