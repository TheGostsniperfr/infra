apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
  project: default
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: mutatingpolicies.policies.kyverno.io
      jsonPointers:
        - /metadata/generation
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: namespacedmutatingpolicies.policies.kyverno.io
      jsonPointers:
        - /metadata/generation
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: namespacedvalidatingpolicies.policies.kyverno.io
      jsonPointers:
        - /metadata/generation
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: validatingpolicies.policies.kyverno.io
      jsonPointers:
        - /metadata/generation
  source:
    repoURL: https://github.com/TheGostsniperfr/infra.git
    targetRevision: HEAD
    path: k8s/config/kyverno
  destination:
    name: in-cluster
    namespace: kyverno
