apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arffornia-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  # offhours-guard scales the website down at night.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  project: default
  source:
    repoURL: https://github.com/TheGostsniperfr/infra.git
    targetRevision: HEAD
    path: k8s/config/arffornia/staging
  destination:
    name: in-cluster
    namespace: arffornia-staging
---
# The `main` tag is mutable: the digest strategy rolls staging out on every new main image.
# Write-back `argocd` pins the digests in the Application spec, not in Git.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: arffornia-staging
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: arffornia-staging
      commonUpdateSettings:
        updateStrategy: digest
        platforms:
          - linux/amd64
      images:
        - alias: backend
          imageName: ghcr.io/arffornia/arffornia_website:main
        - alias: frontend
          imageName: ghcr.io/arffornia/nginx_arffornia_website:main
  writeBackConfig:
    method: argocd
