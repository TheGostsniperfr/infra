# The pack slot (spec 016): test.arffornia.com:25566. The app `playtest-slot` exists only while
# envs/slot.yaml exists in Arffornia_Playtest, so the test server uses no memory between tests.
# `playtest up <Mods or Provisioning PR>` or `playtest up main` writes the file; `playtest down
# slot` or the reaper deletes it, and Argo prunes the app. Its provisioningRef and modTag only
# reach two pod annotations (k8s/config/arffornia/playtest/pack), never the manifests' structure.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: playtest-pack
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/Arffornia/Arffornia_Playtest.git
        revision: envs
        files:
          - path: envs/slot.yaml
  template:
    metadata:
      name: playtest-slot
      annotations:
        playtest.arffornia.com/prs: "{{ .prsText }}"
        playtest.arffornia.com/expires: "{{ .expires }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: playtest
      source:
        repoURL: https://github.com/TheGostsniperfr/infra.git
        targetRevision: HEAD
        path: k8s/config/arffornia/playtest/pack
        kustomize:
          commonAnnotations:
            playtest.arffornia.com/provisioning-ref: "{{ .provisioningRef }}"
            playtest.arffornia.com/mod-tag: "{{ .modTag }}"
      destination:
        name: in-cluster
        namespace: arffornia-slot
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      # offhours-guard scales the slot down at night.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
