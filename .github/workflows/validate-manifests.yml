name: validate-manifests

# Renders every kustomization (with Helm charts inflated, like Argo CD does)
# and validates the output with kubeconform. Needs no secrets: all charts used
# here are public.

on:
  pull_request:
    paths:
      - "k8s/**"
      - "charts/**"
      - ".github/workflows/validate-manifests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-manifests-${{ github.ref }}
  cancel-in-progress: true

env:
  KUSTOMIZE_VERSION: "5.8.2"
  KUSTOMIZE_SHA256: "06af0a202c2b831207d0173f9c9cdb1b30abceca0747cb3fbb72792d26055c95"
  HELM_VERSION: "3.19.0"
  HELM_SHA256: "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496"
  KUBECONFORM_VERSION: "0.7.0"
  KUBECONFORM_SHA256: "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3"

jobs:
  validate:
    name: validate (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The repo-wide scope reports only, until the pre-existing failures outside
    # Arffornia are fixed. The Arffornia scope blocks the PR.
    continue-on-error: ${{ matrix.scope == 'repo' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: arffornia
            roots: "k8s/config/arffornia k8s/apps/arffornia"
          - scope: repo
            roots: "k8s"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install kustomize, helm and kubeconform
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSLo kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tgz" | sha256sum -c -
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kustomize.tgz -C bin kustomize
          tar -xzf helm.tgz --strip-components=1 -C bin linux-amd64/helm
          tar -xzf kubeconform.tgz -C bin kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint local Helm charts
        if: matrix.scope == 'repo'
        run: |
          set -euo pipefail
          for chart in $(git ls-files 'charts/*/Chart.yaml' | xargs -r -n1 dirname); do
            helm lint "$chart"
          done

      - name: Render and validate kustomizations
        env:
          ROOTS: ${{ matrix.roots }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/rendered"
          mkdir -p "$out"
          failed=0
          # Vendored chart directories (k8s/**/charts/) are build caches, not kustomizations.
          dirs=$(find $ROOTS -name kustomization.yaml -not -path '*/charts/*' -exec dirname {} \; | sort)
          for dir in $dirs; do
            file="$out/$(echo "$dir" | tr '/' '_').yaml"
            echo "::group::$dir"
            if ! kustomize build --enable-helm --load-restrictor=LoadRestrictionsNone "$dir" > "$file"; then
              echo "::error title=kustomize build failed::$dir"
              failed=1
              echo "::endgroup::"
              continue
            fi
            if ! kubeconform -strict -summary -output text \
                -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                "$file"; then
              echo "::error title=kubeconform failed::$dir"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
